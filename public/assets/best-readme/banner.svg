<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- MonoForge Amber Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
      <circle cx="40" cy="0" r="1.5" fill="#334155" opacity="0.6" />
    </pattern>

    <!-- Radial Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe600" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes laserBeam {
      0% { stroke-dashoffset: 3120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes floatMascot {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .laser-border {
      stroke-dasharray: 200 1360;
      animation: laserBeam 8s linear infinite;
    }
    .pulse-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .mascot-float {
      transform-box: fill-box;
      transform-origin: center;
      animation: floatMascot 4s ease-in-out infinite;
    }
    .blinking-cursor {
      animation: cursorBlink 1s step-start infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .laser-border, .pulse-glow, .mascot-float, .blinking-cursor {
        animation: none !important;
      }
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="360" rx="20" fill="url(#cyberGrid)" />

  <!-- Radial Atmospheric Glow Behind Logo -->
  <circle cx="600" cy="180" r="300" fill="url(#centerGlow)" />

  <!-- Outer Cyber Frame -->
  <rect x="12" y="12" width="1176" height="336" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />
  <!-- Traveling Perimeter Laser Beam -->
  <rect x="12" y="12" width="1176" height="336" rx="14" fill="none" stroke="url(#amberGrad)" stroke-width="3" class="laser-border" />

  <!-- Corner Brackets -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" />
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" />
  <path d="M 24 316 L 24 336 L 44 336" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" />
  <path d="M 1176 316 L 1176 336 L 1156 336" fill="none" stroke="#ffe600" stroke-width="3" stroke-linecap="round" />

  <!-- Top Decorative Header Bar -->
  <g transform="translate(48, 40)">
    <!-- Traffic lights -->
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" />
    <circle cx="32" cy="0" r="5" fill="#10b981" />
    <!-- Center path indicator -->
    <text x="60" y="4" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      MONOFORGE // BEST-README-TEMPLATE SUITE
    </text>
    <!-- Right Live Status Pill -->
    <g transform="translate(1000, -8)">
      <rect x="0" y="0" width="105" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <circle cx="12" cy="11" r="4" fill="#10b981" />
      <text x="24" y="15" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">
        60FPS CAMO
      </text>
    </g>
  </g>

  <!-- Central Mascot & Shield Emblem -->
  <g class="mascot-float" transform="translate(600, 125)">
    <!-- Shield Outer Glow -->
    <polygon points="0,-48 42,-28 42,24 0,52 -42,24 -42,-28" fill="#1e293b" stroke="#ffe600" stroke-width="2.5" class="pulse-glow" />
    <!-- Inner Shield Plate -->
    <polygon points="0,-40 34,-24 34,20 0,44 -34,20 -34,-24" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- MonoForge Monkey Ears -->
    <circle cx="-22" cy="-6" r="9" fill="#1e293b" stroke="#ffe600" stroke-width="1.5" />
    <circle cx="-22" cy="-6" r="5" fill="#ffe600" opacity="0.6" />
    <circle cx="22" cy="-6" r="9" fill="#1e293b" stroke="#ffe600" stroke-width="1.5" />
    <circle cx="22" cy="-6" r="5" fill="#ffe600" opacity="0.6" />

    <!-- Monkey Head Faceplate -->
    <rect x="-18" y="-18" width="36" height="32" rx="10" fill="#020617" stroke="#ffe600" stroke-width="2" />
    
    <!-- Cybernetic HUD Visor -->
    <rect x="-13" y="-11" width="26" height="10" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <!-- Visor Scan Eye -->
    <circle cx="-5" cy="-6" r="2" fill="#10b981" />
    <circle cx="5" cy="-6" r="2" fill="#10b981" />
    <!-- Center Nose/Mouth dot -->
    <rect x="-3" y="4" width="6" height="3" rx="1.5" fill="#ffe600" />
    <!-- Golden Star Badge -->
    <polygon points="0,22 3,28 9,28 4,32 6,38 0,34 -6,38 -4,32 -9,28 -3,28" fill="#ffe600" />
  </g>

  <!-- Typography Hierarchy -->
  <!-- Super-headline / Badge -->
  <g transform="translate(600, 215)">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#ffe600" stroke="#0f172a" stroke-width="1.5" />
    <text x="0" y="4" text-anchor="middle" fill="#020617" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="2">
      ★ THE DEFINITIVE OPEN-SOURCE README ★
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="270" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    BEST-README-TEMPLATE
  </text>

  <!-- Subtitle / Value Proposition -->
  <text x="600" y="302" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="0.2">
    Engineered with Reference Shields · Interactive TOC · 60+ Built-With Badges · Contributor Avatar Wall
  </text>

  <!-- Bottom Terminal Kinetic Prompt -->
  <g transform="translate(600, 332)">
    <text x="0" y="0" text-anchor="middle" fill="#ffe600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="800">
      $ npx monoforge create --template=best-readme<tspan class="blinking-cursor" fill="#ffe600"> ▋</tspan>
    </text>
  </g>
</svg>
