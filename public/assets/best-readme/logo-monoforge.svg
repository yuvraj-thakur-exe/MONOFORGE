<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseRing 3s ease-in-out infinite;
    }
  </style>

  <!-- Deep Slate Outer Badge Circle -->
  <circle cx="60" cy="60" r="56" fill="#090d16" stroke="#1e293b" stroke-width="3" />

  <!-- Shield Outer Geometry -->
  <polygon points="60,18 96,36 96,72 60,102 24,72 24,36" fill="url(#metalGrad)" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round" class="pulse" />

  <!-- Monkey Mascot Head Outline -->
  <!-- Ears -->
  <circle cx="44" cy="48" r="8" fill="#1e293b" stroke="#ffe600" stroke-width="1.5" />
  <circle cx="76" cy="48" r="8" fill="#1e293b" stroke="#ffe600" stroke-width="1.5" />

  <!-- Face Plate -->
  <rect x="42" y="42" width="36" height="30" rx="8" fill="#020617" stroke="#ffe600" stroke-width="2" />

  <!-- HUD Visor -->
  <rect x="47" y="48" width="26" height="10" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <circle cx="54" cy="53" r="2" fill="#10b981" />
  <circle cx="66" cy="53" r="2" fill="#10b981" />

  <!-- Golden Star at Bottom of Shield -->
  <polygon points="60,76 63,83 70,83 65,88 67,95 60,90 53,95 55,88 50,83 57,83" fill="#ffe600" />
</svg>
