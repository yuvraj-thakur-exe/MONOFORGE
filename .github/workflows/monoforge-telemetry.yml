name: MonoForge Telemetry
on:
  schedule:
    # Runs at midnight every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  monoforge-telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TELEMETRY_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.TELEMETRY_TOKEN || github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: pnpm export:telemetry

      - name: Commit Telemetry SVGs (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/assets/telemetry-*.svg
          git diff --quiet --cached || git commit -m "chore(telemetry): update telemetry SVGs [skip ci]"
          git push || true
