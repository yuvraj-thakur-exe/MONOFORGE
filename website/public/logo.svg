<svg width="520" height="130" viewBox="0 0 520 130" xmlns="http://www.w3.org/2000/svg" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .mono-wordmark {
        fill: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .mono-tagline {
        fill: #94a3b8;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
      }
      @media (prefers-color-scheme: light) {
        .mono-wordmark {
          fill: #09090b;
        }
        .mono-tagline {
          fill: #64748b;
        }
      }
    </style>
  </defs>

  <!-- Left Icon: MonoForge Geometric Monkey in Yellow Badge -->
  <rect x="10" y="10" width="110" height="110" rx="24" fill="#ffe600"/>
  <g transform="translate(15, 12) scale(0.098)" stroke="#0f172a" stroke-width="32" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="4" fill="none">
    <!-- Left Ear -->
    <path d="M 273 374 C 185 374 168 410 168 452 C 168 494 185 521 250 521" />
    <!-- Right Ear -->
    <path d="M 748 374 C 836 374 854 410 854 452 C 854 494 836 521 771 521" />
    <!-- Outer Polygonal Head -->
    <polygon points="512,195 719,310 774,493 594,733 430,733 250,493 305,310" />
    <!-- Inner Facial Mask / Brow Contour -->
    <path d="M 512 393 L 622 342 L 696 415 L 650 545 L 644 650 M 512 393 L 400 342 L 327 415 L 373 545 L 379 650" />
    <!-- Eyes -->
    <circle cx="424" cy="459" r="32" fill="#0f172a" stroke="none" />
    <circle cx="598" cy="459" r="32" fill="#0f172a" stroke="none" />
    <!-- Nose & Philtrum -->
    <path d="M 453 507 L 512 558 L 571 507" />
    <line x1="512" y1="558" x2="512" y2="626" />
    <!-- Mouth -->
    <path d="M 432 651 L 512 626 L 592 651" />
  </g>

  <!-- Wordmark -->
  <text x="140" y="72" class="mono-wordmark">Mono<tspan fill="url(#monoGold)">Forge</tspan></text>
  <text x="142" y="96" class="mono-tagline">ZERO MONKEY BUSINESS • PROFILE STUDIO</text>
</svg>
